<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - WorldExplorer</title>

    <link rel="stylesheet" href="../css/StyleSheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 
    <script src="../JS/AjaxCall.js"></script>
</head>

<body class="auth-page-bg">
    <div id="preloader">
        <div class="loader-content">
            <p>מוזג את הנתונים... 🍻</p>
        </div>
    </div>
    <header>
        <div class="logo">
            <i class="fas fa-globe-americas"></i> WorldExplorer
        </div>
        <nav>
            <ul>
                <li><a href="index.html">דף הבית</a></li>
                <li><a href="my-lists.html">מפת הנסיעות שלי</a></li>
                <li><a href="quizzes.html">חידונים</a></li>
                <li><a href="nightlife.html" style="color: #f59e0b;"><i class="fas fa-beer"></i> חיי לילה</a></li>

                <li id="adminLinkLi" style="display: none;">
                    <a href="admin.html" style="color: #f59e0b; font-weight: bold;"><i class="fas fa-crown"></i> פאנל מנהל</a>
                </li>

                <li id="userGreetingLi" style="display: none;"><span id="userGreeting" style="font-weight: bold; color: #fff; margin: 0 15px;"></span></li>
                <li id="editProfileLi" style="display: none;">
                    <a href="#" id="btnEditProfile" style="color: #60a5fa;"><i class="fas fa-user-edit"></i> ערוך פרופיל</a>
                </li>
                <li id="logoutLi" style="display: none;"><a href="#" id="btnLogout">התנתקות</a></li>

                <li id="registerLi" style="display: none;"><a href="register.html" class="btn" style="border: 1px solid #3b82f6; border-radius: 20px; padding: 5px 15px;">הרשמה</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-box login-box fade-in-up">
            <h2 style="font-size: 2rem; margin-bottom: 30px;"><i class="fas fa-sign-in-alt"></i> ברוך שובך</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">דוא"ל</label>
                    <input type="email" id="email" class="form-control" placeholder="הזן את כתובת המייל שלך" required>
                </div>

                <div class="form-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" class="form-control" placeholder="הזן סיסמה" required>
                </div>

                <button id="btnLogin" type="submit" class="btn" style="width: 100%; margin-top: 15px; font-size: 1.2rem;">התחבר</button>
            </form>

            <p style="margin-top: 25px; color: var(--text-muted);">
                עדיין אין לך חשבון? <a href="register.html" class="auth-link">הירשם עכשיו</a>
            </p>
        </div>
    </main>


</body>
</html>
